<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="{{ site.url }}" style="border-right: none !important;">Dimitris Karakasilis<br><small>blogs here</small></a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ml-auto">
            {% if page.url == '/compact.html' or page.url == '/compact/' %}
            <li class="nav-item d-flex align-items-center">
              <a class="nav-link" href="{{ '/' | relative_url }}" style="padding: 0.5rem 0.5rem; border-left: none !important; margin-right: 1rem;" title="Extended View">
                <i class="fas fa-th-large"></i>
              </a>
            </li>
            {% else %}
            <li class="nav-item d-flex align-items-center">
              <a class="nav-link" href="{{ '/compact.html' | relative_url }}" style="padding: 0.5rem 0.5rem; border-left: none !important; margin-right: 1rem;" title="Compact View">
                <i class="fas fa-list"></i>
              </a>
            </li>
            {% endif %}
            <li class="nav-item">
              <a class="nav-link" href="https://www.linkedin.com/in/jimmykarily/">
                <i class="fab fa-linkedin"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="https://github.com/jimmykarily/">
                <i class="fab fa-github"></i>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="mailto:dimitris@karakasilis.me">
                <i class="fas fa-at"></i>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="container">
      <div class="row">
        <!-- Blog Entries Column -->
        <div class="col-md-8 text-justify" id="main-content">
          {{ content }}
        </div>

        <!-- Sidebar Widgets Column -->
        {% include sidebar.html %}
      </div>
      <!-- /.row -->

    </div>
    <!-- /.container -->

    <!-- Footer -->
    {% include footer.html %}

    <!-- Bootstrap core JavaScript -->
    <script src="{{ "/vendor/jquery/jquery.min.js" | prepend: site.baseurl }}"></script>
    <script src="{{ "/vendor/bootstrap/js/bootstrap.bundle.min.js" | prepend: site.baseurl }}"></script>
  </body>
</html>
